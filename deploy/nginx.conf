# Install inside /etc/nginx/conf.d/ only AFTER the certificate exists.
# nginx.conf must include conf.d/*.conf within its http block.
limit_req_zone $binary_remote_addr zone=sansphase_login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=sansphase_upload:10m;
# Query strings can contain private draft-preview IDs: deliberately omit them.
log_format sansphase '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name www.sansphase.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://www.sansphase.com$request_uri; }
}

server {
    listen 443 ssl;
    server_name www.sansphase.com;
    ssl_certificate /etc/letsencrypt/live/www.sansphase.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.sansphase.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/sansphase-access.log sansphase;
    error_log /var/log/nginx/sansphase-error.log warn;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    # Do not enable preload or includeSubDomains before all subdomains are ready.
    add_header Strict-Transport-Security "max-age=86400" always;
    client_max_body_size 2m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_cache off;
    proxy_max_temp_file_size 0;

    location = /api/author/login {
        limit_req zone=sansphase_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:4176;
    }
    location = /api/author/upload {
        # 15 GiB file plus a small multipart envelope; application checks exact size.
        client_max_body_size 15361m;
        client_body_timeout 120s;
        limit_conn sansphase_upload 2;
        limit_conn_status 429;
        proxy_request_buffering off;
        proxy_read_timeout 21600s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:4176;
    }
    location ^~ /api/media/ {
        proxy_buffering off;
        proxy_pass http://127.0.0.1:4176;
    }
    location / { proxy_pass http://127.0.0.1:4176; }
}
