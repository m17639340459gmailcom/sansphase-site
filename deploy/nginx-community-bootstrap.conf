# Temporary ACME-only host. Replace with nginx-community.conf after issuance.
log_format community_bootstrap '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
server {
    listen 80;
    server_name community.sansphase.com;
    server_tokens off;
    access_log /var/log/nginx/community-access.log community_bootstrap;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 503; }
}
