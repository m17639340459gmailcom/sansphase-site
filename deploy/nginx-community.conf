# Independent Hong Kong host. Main-site account cookies and data stay at main.
limit_req_zone $binary_remote_addr zone=community_entry:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=community_upload:10m;
log_format community_safe '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name community.sansphase.com;
    access_log /var/log/nginx/community-access.log community_safe;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://community.sansphase.com$request_uri; }
}
server {
    listen 443 ssl;
    http2 on;
    server_name community.sansphase.com;
    ssl_certificate /etc/letsencrypt/live/community.sansphase.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/community.sansphase.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/community-access.log community_safe;
    error_log /var/log/nginx/community-error.log warn;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=86400" always;
    client_max_body_size 2m;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection "";
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_cache off;
    proxy_max_temp_file_size 0;
    proxy_hide_header X-Preview-App;
    location = /api/community-entry {
        limit_req zone=community_entry burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 8k;
        proxy_pass http://127.0.0.1:4176;
    }
    location = /api/community/profile/avatar {
        # 2 MiB file plus multipart headers; the application checks the file limit.
        client_max_body_size 2112k;
        limit_conn community_upload 2;
        limit_conn_status 429;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4176;
    }
    location = /api/community/profile/background {
        client_max_body_size 2112k;
        limit_conn community_upload 2;
        limit_conn_status 429;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4176;
    }
    location = /api/community/manage/banner-image {
        # Existing 25 MiB owner allowance plus multipart headers; role limits stay in the application.
        client_max_body_size 26m;
        limit_conn community_upload 2;
        limit_conn_status 429;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4176;
    }
    location = /api/community/manage/item-image {
        # Existing 25 MiB owner artwork allowance plus multipart headers.
        client_max_body_size 26m;
        limit_conn community_upload 2;
        limit_conn_status 429;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4176;
    }
    location = /api/community/images {
        limit_conn community_upload 2;
        limit_conn_status 429;
        client_max_body_size 21m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:4176;
    }
    location / { proxy_pass http://127.0.0.1:4176; }
}
