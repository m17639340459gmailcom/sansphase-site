<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="G3 拾光"><style>
.spin{transform-origin:100px 100px;animation:spin 36.8s linear infinite}
.spinr{transform-origin:100px 100px;animation:spin 207s linear infinite reverse}
.sweep{transform-origin:100px 100px;animation:spin 14.95s linear infinite}
.gal{transform-origin:100px 100px;animation:spin 105.8s linear infinite}
.orbit{transform-origin:100px 100px;animation:spin 25.3s linear infinite}
.orbitr{transform-origin:100px 100px;animation:spin 34.5s linear infinite reverse}
.rip{transform-origin:100px 100px;opacity:0;animation:rip 10.12s ease-out infinite}
.wing{transform-origin:100px 100px;animation:wing 10.12s ease-in-out infinite}
.rise{transform-box:fill-box;transform-origin:center;opacity:0;animation:rise 9.66s ease-out infinite}
.motif{transform-origin:100px 62px;animation:motif 5.2s ease-in-out infinite}
@keyframes motif{0%,100%{transform:rotate(-4.5deg)}50%{transform:rotate(4.5deg)}}
.ray0{transform-origin:100px 100px;animation:spin 110.4s linear infinite}
.ray1{transform-origin:100px 100px;animation:spin 161s linear infinite reverse}
.au0{transform-origin:100px 100px;animation:spin 20.7s linear infinite}
.au1{transform-origin:100px 100px;animation:spin 29.9s linear infinite reverse}
.run2{stroke-dasharray:9 91;animation:run 11.96s linear infinite}
.nova{transform-origin:100px 100px;opacity:0;animation:nova 14.95s ease-out infinite}
.novaring{transform-origin:100px 100px;opacity:0;animation:novaring 14.95s ease-out infinite}
@keyframes nova{0%,72%{opacity:0;transform:scale(.3)}80%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.5)}}
@keyframes novaring{0%,76%{opacity:0;transform:scale(.4)}82%{opacity:.9}100%{opacity:0;transform:scale(3)}}
.gl0{animation:gl 6.44s ease-in-out infinite}
.gl1{animation:gl 5.06s ease-in-out -.9s infinite}
.gl2{animation:gl 7.82s ease-in-out -1.7s infinite}
@keyframes rip{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.58);opacity:0}}
