<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="G4 寻星"><style>
.spin{transform-origin:100px 100px;animation:spin 32s linear infinite}
.spinr{transform-origin:100px 100px;animation:spin 180s linear infinite reverse}
.sweep{transform-origin:100px 100px;animation:spin 13s linear infinite}
.gal{transform-origin:100px 100px;animation:spin 92s linear infinite}
.orbit{transform-origin:100px 100px;animation:spin 22s linear infinite}
.orbitr{transform-origin:100px 100px;animation:spin 30s linear infinite reverse}
.rip{transform-origin:100px 100px;opacity:0;animation:rip 8.8s ease-out infinite}
.wing{transform-origin:100px 100px;animation:wing 8.8s ease-in-out infinite}
.rise{transform-box:fill-box;transform-origin:center;opacity:0;animation:rise 8.4s ease-out infinite}
.motif{transform-origin:100px 100px;animation:motif 6.4s ease-in-out infinite}
@keyframes motif{0%,100%{transform:rotate(-6deg)}35%{transform:rotate(5deg)}55%{transform:rotate(1deg)}78%{transform:rotate(6deg)}}
.ray0{transform-origin:100px 100px;animation:spin 96s linear infinite}
.ray1{transform-origin:100px 100px;animation:spin 140s linear infinite reverse}
.au0{transform-origin:100px 100px;animation:spin 18s linear infinite}
.au1{transform-origin:100px 100px;animation:spin 26s linear infinite reverse}
.run2{stroke-dasharray:9 91;animation:run 10.4s linear infinite}
.nova{transform-origin:100px 100px;opacity:0;animation:nova 13s ease-out infinite}
.novaring{transform-origin:100px 100px;opacity:0;animation:novaring 13s ease-out infinite}
@keyframes nova{0%,72%{opacity:0;transform:scale(.3)}80%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1.5)}}
@keyframes novaring{0%,76%{opacity:0;transform:scale(.4)}82%{opacity:.9}100%{opacity:0;transform:scale(3)}}
.gl0{animation:gl 5.6s ease-in-out infinite}
.gl1{animation:gl 4.4s ease-in-out -.9s infinite}
.gl2{animation:gl 6.8s ease-in-out -1.7s infinite}
@keyframes rip{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.58);opacity:0}}
@keyframes wing{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes rise{0%{transform:translateY(7px) scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-17px) scale(1);opacity:0}}
@keyframes gl{0%,100%{opacity:.15}50%{opacity:1}}
.breath{transform-origin:100px 100px;animation:breath 10s ease-in-out infinite}
.beat{animation:beat 6.8s ease-in-out infinite}
.drift0{animation:drift0 26s ease-in-out infinite alternate}
.drift1{animation:drift1 34s ease-in-out infinite alternate}
.tw0{animation:tw 6.2s ease-in-out infinite}
.tw1{animation:tw 4.6s ease-in-out -1.1s infinite}
.tw2{animation:tw 8.4s ease-in-out -2.4s infinite}
.run{stroke-dasharray:7 93;animation:run 11s linear infinite}
.shoot{opacity:0;animation:shoot 14s ease-in infinite}
.shoot.late{animation-delay:-6.4s;animation-name:shoot2}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breath{0%,100%{opacity:.5;transform:scale(.95)}50%{opacity:.95;transform:scale(1.03)}}
@keyframes beat{0%,100%{transform:scale(.9);opacity:.82}50%{transform:scale(1.08);opacity:1}}
@keyframes drift0{from{transform:translate(-7px,4px)}to{transform:translate(9px,-6px)}}
@keyframes drift1{from{transform:translate(8px,6px)}to{transform:translate(-9px,-5px)}}
@keyframes tw{0%,100%{opacity:.5}50%{opacity:1}}
@keyframes run{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes shoot{0%{transform:translate(150px,58px);opacity:0}3%{opacity:1}13%{transform:translate(62px,92px);opacity:0}100%{transform:translate(62px,92px);opacity:0}}
@keyframes shoot2{0%{transform:translate(138px,104px);opacity:0}3%{opacity:1}12%{transform:translate(70px,130px);opacity:0}100%{transform:translate(70px,130px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.run,.run2,.shoot,.sweep,.nova,.novaring{display:none}}
