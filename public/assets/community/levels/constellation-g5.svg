<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="G5 观星"><style>
.spin{transform-origin:100px 100px;animation:spin 28.8s linear infinite}
.spinr{transform-origin:100px 100px;animation:spin 162s linear infinite reverse}
.sweep{transform-origin:100px 100px;animation:spin 11.7s linear infinite}
.gal{transform-origin:100px 100px;animation:spin 82.8s linear infinite}
.orbit{transform-origin:100px 100px;animation:spin 19.8s linear infinite}
.orbitr{transform-origin:100px 100px;animation:spin 27s linear infinite reverse}
.rip{transform-origin:100px 100px;opacity:0;animation:rip 7.92s ease-out infinite}
.wing{transform-origin:100px 100px;animation:wing 7.92s ease-in-out infinite}
.rise{transform-box:fill-box;transform-origin:center;opacity:0;animation:rise 7.56s ease-out infinite}
.motif{transform-origin:100px 100px;animation:motif 7.5s ease-in-out infinite}
@keyframes motif{0%,100%{transform:translate(-3.5px,.5px)}50%{transform:translate(3.5px,-1px)}}
.ray0{transform-origin:100px 100px;animation:spin 86.4s linear infinite}
.ray1{transform-origin:100px 100px;animation:spin 126s linear infinite reverse}
.au0{transform-origin:100px 100px;animation:spin 16.2s linear infinite}
.au1{transform-origin:100px 100px;animation:spin 23.4s linear infinite reverse}
.run2{stroke-dasharray:9 91;animation:run 9.36s linear infinite}
.nova{transform-origin:100px 100px;opacity:0;animation:nova 11.7s ease-out infinite}
.novaring{transform-origin:100px 100px;opacity:0;animation:novaring 11.7s ease-out infinite}
