@keyframes novaring{0%,76%{opacity:0;transform:scale(.4)}82%{opacity:.9}100%{opacity:0;transform:scale(3)}}
.gl0{animation:gl 5.04s ease-in-out infinite}
.gl1{animation:gl 3.96s ease-in-out -.9s infinite}
.gl2{animation:gl 6.12s ease-in-out -1.7s infinite}
