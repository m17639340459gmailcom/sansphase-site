<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="G2 星火"><style>
.spin{transform-origin:100px 100px;animation:spin 41.6s linear infinite}
.spinr{transform-origin:100px 100px;animation:spin 234s linear infinite reverse}
.sweep{transform-origin:100px 100px;animation:spin 16.9s linear infinite}
.gal{transform-origin:100px 100px;animation:spin 119.6s linear infinite}
.orbit{transform-origin:100px 100px;animation:spin 28.6s linear infinite}
.orbitr{transform-origin:100px 100px;animation:spin 39s linear infinite reverse}
.rip{transform-origin:100px 100px;opacity:0;animation:rip 11.44s ease-out infinite}
.wing{transform-origin:100px 100px;animation:wing 11.44s ease-in-out infinite}
.rise{transform-box:fill-box;transform-origin:center;opacity:0;animation:rise 10.92s ease-out infinite}
.motif{transform-origin:100px 135px;animation:motif 2.3s ease-in-out infinite}
@keyframes motif{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.96,1.07) skewX(-2.5deg)}62%{transform:scale(1.03,.97) skewX(2.5deg)}}
.ray0{transform-origin:100px 100px;animation:spin 124.8s linear infinite}
.ray1{transform-origin:100px 100px;animation:spin 182s linear infinite reverse}
.au0{transform-origin:100px 100px;animation:spin 23.4s linear infinite}
.au1{transform-origin:100px 100px;animation:spin 33.8s linear infinite reverse}
.run2{stroke-dasharray:9 91;animation:run 13.52s linear infinite}
.nova{transform-origin:100px 100px;opacity:0;animation:nova 16.9s ease-out infinite}
.novaring{transform-origin:100px 100px;opacity:0;animation:novaring 16.9s ease-out infinite}
