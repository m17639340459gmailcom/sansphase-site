<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月相 VIP 头像框试稿 v1</title>
<style>
  body { margin: 0; font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif; background: #05070d; color: #cdd8ea; }
  header { padding: 22px 28px 6px; }
  h1 { margin: 0 0 4px; font-size: 20px; color: #f1f5ff; }
  header p { margin: 0; color: #8fa0ba; max-width: 900px; }
  section { margin: 22px 28px; border: 1px solid #1c2538; border-radius: 12px; overflow: hidden; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; }
  .theme { padding: 40px 26px 26px; display: grid; gap: 34px; justify-items: center; }
  .dark { background: radial-gradient(90% 80% at 20% 0, #131c33, #0a0f1d 75%); color: #dce6f7; }
  .light { background: radial-gradient(80% 65% at 18% 0, #fffcf3, #e8e2d6 78%); color: #2c3546; }
  .av { position: relative; flex: none; width: var(--s); height: var(--s); margin: calc(var(--s) * .34); }
  .av > .face { width: 100%; height: 100%; border-radius: 50%; display: block; }
  .av > :is(svg, .still) { position: absolute; inset: -33.2%; width: 166.4%; height: 166.4%; pointer-events: none; }
  .row { display: flex; align-items: center; flex-wrap: wrap; justify-content: center; }
  figure { margin: 0; display: grid; justify-items: center; }
  figcaption { font-size: 11px; opacity: .6; }
  .post { display: flex; align-items: center; gap: 6px; width: min(100%, 380px); padding: 10px 14px; border-radius: 10px; box-sizing: border-box; }
  .dark .post { background: #121a2c; border: 1px solid #243049; }
  .light .post { background: #fbf7ef; border: 1px solid #d9cfbb; }
  .post .av { margin: 14px 18px 14px 12px; }
  .post b { font-size: 14px; }
  .post .badge { width: 34px; height: 34px; }
  .post p { margin: 0; font-size: 12px; opacity: .65; }
</style>
</head>
<body>
<header>
  <h1>月相 VIP 头像框试稿 v1</h1>
  <p>原画做底，动效全部是叠在原画上的光。框按头像的 166.4% 叠放。左边深色主题、右边浅色主题；第一行左是带动效、右是原图静态，用来对比。</p>
</header>
<main id="main"></main>
<script type="module">
import { moonFrameSVG, moonFrameCSS } from './frame.js';
document.head.appendChild(Object.assign(document.createElement('style'), { textContent: moonFrameCSS }));
const face = (a, b, c) => 'data:image/svg+xml,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient></defs><rect width="100" height="100" fill="url(#g)"/><circle cx="50" cy="40" r="17" fill="${c}"/><path d="M16 100c2-24 16-36 34-36s32 12 34 36Z" fill="${c}"/></svg>`);
const faces = [face('#23345c', '#0d1428', '#7f97c9'), face('#f4e9d8', '#e3c9a8', '#a9805a'), face('#7fb7a4', '#c9d99a', '#2f5d57')];
const av = (s, k, still) => `<div class="av" style="--s:${s}px"><img class="face" src="${faces[k % 3]}" alt="">${still ? '<img class="still" src="base-640.webp" alt="">' : moonFrameSVG()}</div>`;
const theme = name => `<div class="theme ${name}">
  <div class="row"><figure>${av(220, name === 'dark' ? 0 : 1)}<figcaption>带动效</figcaption></figure><figure>${av(220, name === 'dark' ? 0 : 1, true)}<figcaption>原图静态</figcaption></figure></div>
  <div class="row">${[96, 64, 48, 40, 32].map((s, k) => `<figure>${av(s, k + 1)}<figcaption>${s}px</figcaption></figure>`).join('')}</div>
  <div class="post">${av(40, 2)}<div><div style="display:flex;align-items:center;gap:4px"><b>星海旅人</b><img class="badge" src="vip-5.svg" alt=""></div><p>3 分钟前 · 帖子列表里的样子</p></div></div></div>`;
document.getElementById('main').innerHTML = `<section><div class="pair">${theme('dark')}${theme('light')}</div></section>`;
</script>
</body>
</html>
